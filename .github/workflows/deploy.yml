name: Deploy to Railway
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orch, sophia, veritas, torch, nexus, hdm, gcm, mel, apm, w3c, chesed, shofet]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service trinity-${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
