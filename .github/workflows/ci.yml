# S-QUORUM Phase 7 — CI gate for trinity-symphony-shared.
#
# The agent code has no jest setup; tests are plain `node tests/*.test.js` scripts.
# This gate (a) syntax-checks the core agent libs and (b) runs the node test suite.
# escalation-contract.test.js is jest-style (uses jest.fn()) and is intentionally
# excluded — it can't run under bare node. Make this a required check in branch
# protection (Settings → Branches) once green.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      - name: Syntax-check core agent libs
        run: |
          node -c lib/ConstitutionalAgentV4.js
          node -c lib/resolve-supabase-service-key.js
          node -c lib/tool-call-logger.js
          node -c scripts/ops/claim-exhausted.js
          node -c lib/emergency-halt.js
          node -c constitutional-agent-base.js
          node -c trinity-worker.js
          node -c lib/swarm-toolbelt.js
          if [ -f lib/getNextTask.js ]; then node -c lib/getNextTask.js; fi

      - name: Node tests
        run: |
          node tests/getNextTask.test.js
          # Fail-closed Supabase service-key resolution — proves a missing service
          # key THROWS instead of silently degrading the admin client to anon
          # (the RLS-loop that killed the fleet heartbeat quietly).
          node tests/supabaseServiceKeyResolve.test.js
          node tests/claimCap.test.js
          node tests/claimCallSite.test.js
          node tests/provenance.test.js
          node tests/pulseCheckExecutor.test.js
          node tests/heartbeatDbWritesGate.test.js
          # L0 gate 0.4 — the kill switch. The coverage pin FAILS when a new
          # loop is added without gating it, so it must run on every PR or the
          # switch silently stops being global (which is how the engine's
          # version came to cover 3 of 14 loops).
          node tests/emergency-halt.test.js
          node tests/emergency-halt-coverage.test.js
          # agent-controls.test.js already existed and passed but was never in
          # this list — a test that never runs proves nothing. Added because it
          # covers the sibling lever the halt composes with.
          node tests/agent-controls.test.js
          # Redis circuit breaker for the Upstash-backed control cache — pins
          # that a dead UPSTASH_REDIS_REST_URL degrades to one warning burst
          # plus a cooldown instead of a failing call (and a log line) forever,
          # and that a recovered endpoint is used again once the cooldown ends.
          node tests/agentControlsRedisBreaker.test.js
          # Survivor liveness. Pins that the group watchdog reads a signal that is
          # actually written, that absence is never reported as death, and that
          # "every peer is dead" indicts the sensor rather than the peers. The
          # pre-fix code scored 0/11 here — it alerted on trinity_heartbeat.last_seen,
          # which stopped being written on 2026-07-17 and froze the whole fleet
          # "DOWN" for a month while every agent was serving HTTP 200.
          node tests/survivorLiveness.test.js
